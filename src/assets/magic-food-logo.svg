<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Magic Food Logo</title>
<desc>Magic Food restaurant logo featuring a cloche dome with a shooting star and magic wand</desc>
<defs>
  <radialGradient id="domeGrad" cx="50%" cy="60%" r="55%">
    <stop offset="0%" stop-color="#e8142a"/>
    <stop offset="100%" stop-color="#a50d1e"/>
  </radialGradient>
  <radialGradient id="starTrailGrad" cx="20%" cy="50%" r="80%">
