    <stop offset="100%" stop-color="#0d0d1a"/>
  </radialGradient>
  <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5a5a5a"/>
    <stop offset="100%" stop-color="#2a2a2a"/>
