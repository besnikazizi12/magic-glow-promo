  <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffe84d"/>
    <stop offset="100%" stop-color="#d4a000"/>
  </linearGradient>
  <filter id="glow">
